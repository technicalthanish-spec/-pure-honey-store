name: Business tools checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: honey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: honey_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/sales-report.mjs
      - run: node tests/admin-tools.mjs
      - name: Test database migrations and transactions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/auth-stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migration_v6.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migration_v7.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migration_v7.sql
          psql -v ON_ERROR_STOP=1 -f tests/admin-tools.sql
